<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Offline</title>

    <style>
        body {
            margin: 0;
            padding: 2rem;
            background: #111;
            color: #ddd;
            font-family: system-ui, sans-serif;
            line-height: 1.6;
        }

        main {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            color: #fff;
        }

        code {
            color: #ffd166;
        }
    </style>
</head>
<body>
    <main>
        <h1>Offline</h1>

        <p>
            This document is not available offline yet.
        </p>

        <p>
            Open it once while online, then it will be saved for offline use.
        </p>

        <p>
            Previously opened Bible files should still work.
        </p>
    </main>
</body>
</html>
