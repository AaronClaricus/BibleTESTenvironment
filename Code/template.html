<!DOCTYPE html>
<html>
	<head>

	<meta charset="UTF-8">
		<link rel="stylesheet" href="./Code//css4.css">
		<style>
			
					html,
		body{
			margin:0;
			padding:0;
			width:100%;
			height:100%;
			font-family:monospace;
			white-space:normal;
			overflow-wrap:break-word;
			word-break:break-word;
			line-height:1.4;
			background:#222222;
			color:#E0E0E0;
			box-sizing:border-box;
		}
		body > *:first-child{
			margin-top:0;
			margin-top:0;
		}
		#content{
			white-space:pre-wrap;
			overflow-wrap:break-word;
			word-break:break-word;
			margin:0;
			padding:12px;
			overflow-y: auto;
			margin-bottom:80px;
			padding-bottom:80px;
		}
		::selection {
			background: __HIGHLIGHT_BG__;
			color: __HIGHLIGHT_TEXT__;
		}
		html, body {
			font-size:__FONT_SIZE__;
		}
		/* =====================================
   SCRIPTURE FONT
===================================== */

@import url("https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;500;600;700&display=swap");

html,
body,
#content{
    font-family:"Source Serif 4", Georgia, serif !important;
    line-height:1.65 !important;
    letter-spacing:.01em;
}
		
		</style>
	</head>
<body><div id="content">__CONTENT__</div><br><br><br><br><br><br></body>
</html>
